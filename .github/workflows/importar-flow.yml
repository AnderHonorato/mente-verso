name: Importar Flow Programacao v0.6.0
on:
  push:
    branches:
      - integracao/flow-programacao-v0.6.0
    paths:
      - 'pacotes/flow-v0.6.0/**'
permissions:
  contents: write
jobs:
  importar:
    name: Verificar e extrair codigo fonte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir ZIP e extrair codigo
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, pathlib, stat, zipfile
          partes = sorted(pathlib.Path("pacotes/flow-v0.6.0").glob("parte-*.b64"))
          assert len(partes) == 9, f"Esperadas 9 partes, encontradas {len(partes)}"
          pacote = base64.b64decode("".join(p.read_text(encoding="ascii") for p in partes), validate=True)
          resumo = hashlib.sha256(pacote).hexdigest()
          esperado = "6eeca8d93f88c8cf9527df22fd1285f86ccf60b245e72a2a06127d2b8897ac30"
          assert resumo == esperado, f"SHA-256 divergente: {resumo}"
          destino = pathlib.Path("integracoes/flow-programacao")
          quantidade = 0
          with zipfile.ZipFile(io.BytesIO(pacote)) as zipado:
              assert zipado.testzip() is None, "Arquivo ZIP corrompido"
              for entrada in zipado.infolist():
                  nome = pathlib.PurePosixPath(entrada.filename)
                  if entrada.is_dir() or nome.is_absolute() or ".." in nome.parts:
                      continue
                  if (entrada.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      continue
                  if entrada.filename.startswith((
                      "aplicativos/web/dist/", ".github/workflows/",
                      "node_modules/", ".git/", "__pycache__/"
                  )):
                      continue
                  if any(parte == "node_modules" for parte in nome.parts):
                      continue
                  arquivo = destino.joinpath(*nome.parts)
                  arquivo.parent.mkdir(parents=True, exist_ok=True)
                  arquivo.write_bytes(zipado.read(entrada))
                  quantidade += 1
          print(f"SHA-256 conferido: {resumo}; {quantidade} arquivos extraidos em {destino}")
          assert quantidade > 250, "Importacao incompleta"
          PY
      - name: Publicar arquivos extraidos na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integracoes/flow-programacao
          git rm -r pacotes/flow-v0.6.0
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar fontes do Flow 0.6.0 para integracao"
            git push origin HEAD:integracao/flow-programacao-v0.6.0
          fi
